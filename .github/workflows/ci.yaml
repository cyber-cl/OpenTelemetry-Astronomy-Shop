# CI for Product Catalog Service

name: product-catalog-service-ci

on:
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4


            - name: Setup Go 1.24 
              uses: actions/setup-go@v4
              with:
                  go-version: '1.24'


            - name: Build with Go
              run: |
                cd src/product-catalog 
                go mod download
                go build -o product-catalog-service main.go

            

            - name: unit tests
              run: |
                cd src/product-catalog
                go test ./...

    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4


            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version-file: src/product-catalog/go.mod

            - name: golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.12
                  working-directory: src/product-catalog

    docker:
        runs-on: ubuntu-latest

        needs: 
            - build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Docker Push
              uses: docker/build-push-action@v6
              with:
                  context: ./src/product-catalog
                  file: ./src/product-catalog/Dockerfile
                  push: true
                  tags: ${{secrets.DOCKER_USERNAME}}/product-catalog-service:${{github.run_id}}

    update-k8s-deployment:
        runs-on: ubuntu-latest

        needs: 
            - docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.TOKEN }}

            - name: Update tag in kubernetes deployment manifest
              run: |
                  sed -i "s|image: .*|image: ${{secrets.DOCKER_USERNAME}}/product-catalog-service:${{github.run_id}}|" ./kubernetes/productcatalog/deploy.yaml
           
            - name: Commit and push changes
              run: |
                    git config --global user.name "Prashant Jakhar"
                    git config --global user.email "prashantrock777@gmail.com"
                    git add ./kubernetes/productcatalog/deploy.yaml
                    git commit -m "[CI] Update image tag to ${{secrets.DOCKER_USERNAME}}/product-catalog-service:${{github.run_id}}"
                    git pull --rebase origin ${{ github.head_ref }}
                    git push origin HEAD:${{ github.head_ref }}